<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CAPTAIN</title>
  <link rel="stylesheet" href="jarvis.css">
</head>
<body>
  <main>
    <header>
      <div class="brand">CAPTAIN <small>PRIVATE BROWSER AGENT</small></div>
      <span class="online"><i id="dot"></i><span id="connection">Checking</span></span>
    </header>
    <section id="chat-view" aria-label="Text command controller">
      <h1 id="phase">Ready</h1>
      <p id="message"></p>
      <p id="command-status" role="status"></p>

      <div id="composer">
        <textarea id="task" rows="2" placeholder="Type a command"></textarea>
        <button id="run">Run</button>
      </div>
      <button id="resume-task" aria-label="Resume after human verification" hidden>Resume CAPTAIN</button>
      <button id="cancel-task" aria-label="Cancel current task">Cancel</button>

      <p>On a webpage, hold E for 4 seconds to open CAPTAIN at the top left.</p>
      <p id="target-status" role="status"></p>
      <div class="metrics"><span><b id="step">0</b> steps</span><span><b id="pii">0</b> marked</span><span id="latency">—</span><span id="shield">Normal tab</span></div>
    </section>
    <button id="settings">Settings</button>
  </main>
  <script src="vision-host.js"></script>
  <script src="popup.js"></script>
  <script src="jarvis.js"></script>
</body>
</html>
